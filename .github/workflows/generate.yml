name: FSDM 通用执行器

# Worker repository_dispatch 触发（唯一入口：gha/runner.py 白名单路由）。
# 任务数据、图片由 GHA 直连飞书读取，不传文件、不走 R2。
on:
  repository_dispatch:
    types: [fsdm-job]
  workflow_dispatch:
    inputs:
      job:
        description: 'job 名（generate / update）'
        required: false
        default: 'generate'
        type: string
      args:
        description: '附加参数（如 --limit 2）'
        required: false
        type: string
  # 缓存续期：每 6 天 restore 后原样 save 新 key，避免 7 天未访问被 GHA 清理
  schedule:
    - cron: '0 2 */6 * *'

jobs:
  # ---------------- 缓存续期：只 restore + 打标，触发 post 阶段 save 新 key
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: imgcache
        with:
          path: gha/.image_cache
          key: fsdm-img-${{ github.run_id }}
          restore-keys: |
            fsdm-img-
      - name: 续期标记
        run: mkdir -p gha/.image_cache && echo keepalive > gha/.image_cache/.keep

  # ---------------- 通用执行
  run:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: fsdm-run
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 图片素材缓存：前缀命中上次的包，本轮 run 结束存新 key（相当于续期）
      - uses: actions/cache@v4
        with:
          path: gha/.image_cache
          key: fsdm-img-${{ github.run_id }}
          restore-keys: |
            fsdm-img-

      - name: 运行 job
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TABLE_PREFIX: ${{ vars.TABLE_PREFIX }}
          JOB_ID: ${{ github.event.client_payload.jobId }}
          FSDM_JOB: ${{ github.event.client_payload.job || inputs.job || 'generate' }}
          FSDM_ARGS: ${{ github.event.client_payload.args || inputs.args }}
          FSDM_IMAGE_CACHE: gha/.image_cache
        run: python gha/runner.py
